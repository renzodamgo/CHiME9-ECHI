device: ${..device}

noisy_signal: ${..paths.train_input_file}
ref_signal: ${..paths.train_target_file}
rainbow_signal: ${..paths.train_rainbow_file}

sessions_file: ${..paths.sessions_file}
segments_file: ${..paths.segment_info_file}

joint_for: ["train", "dev"]

signal:
  noisy_sr: 48000
  ref_sr: 16000
  spkid_sr: 48000

# VRAM Optimization Settings
# Current: Conservative settings for 80GB A100
# For more VRAM usage, try: train.batch_size=16, dev.batch_size=8
# For less VRAM usage, try: train.batch_size=4, dev.batch_size=2
loader:
  train:
    batch_size: 4 # Increased from 1 for ~8x speedup
    num_workers: 4
    shuffle: true
    pin_memory: true
  dev:
    batch_size: 4 # Increased from 1 for ~4x speedup
    num_workers: 4
    shuffle: false
    pin_memory: true
